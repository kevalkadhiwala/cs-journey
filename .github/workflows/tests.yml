name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [student-grade-manager, cybersecurity-log-analyzer]
    defaults:
      run:
        working-directory: Projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: python -m pytest -q

  docker:
    # Build each image and check the API answers inside the container
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: cybersecurity-log-analyzer
            check: /suspicious-ips
          - project: student-grade-manager
            check: /subjects
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t app Projects/${{ matrix.project }}
      - name: Start container and call the API
        run: |
          # Render passes the port in $PORT, so test it the same way
          docker run -d --name app -e PORT=10000 -p 8000:10000 app
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000${{ matrix.check }}
      - name: Show container logs
        if: always()
        run: docker logs app
